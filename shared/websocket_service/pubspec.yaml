name: websocket_service
publish_to: 'none'

environment:
  sdk: '>=3.0.6 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State management
  mobx: ^2.1.4
  flutter_mobx: ^2.0.6+5
  
  # Code generation
  freezed: ^2.5.7
  json_annotation: ^4.9.0
  
  # WebSocket
  socket_io_client: ^3.1.2
  
  # Shared modules
  data:
    path: ../data
  constants:
    path: ../constants
  core:
    path: ../core

dev_dependencies:
  flutter_test:
    sdk: flutter
  
  # Code generation
  build_runner: ^2.3.3
  mobx_codegen: ^2.2.0
  freezed: ^2.5.7
  json_serializable: ^6.6.1
  
  # Testing
  mockito: ^5.4.4