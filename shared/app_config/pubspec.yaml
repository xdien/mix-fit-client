name: app_config
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
environment:
  sdk: '>=3.0.6 <4.0.0'

dependencies:
  build_config: ^1.1.2
  flutter:
    sdk: flutter
  yaml: ^3.1.2
  json_schema: ^5.1.4
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0

dev_dependencies:
  build_runner: ^2.3.3
  freezed: ^2.4.7
  json_serializable: ^6.7.1
  flutter_test:
    sdk: flutter

flutter:
  assets:
    - assets/config/development_config.json
    - assets/config/production_config.json
    - assets/config/schema/environment_config_schema.json
    - ../../config/environments/